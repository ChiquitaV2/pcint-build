name: Codeberg Remote Build (Win/Lin/Mac)
on:
  repository_dispatch:
    types: [codeberg-build]
jobs:
  build:
    name: Build ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: build:windows
            job_name: Windows-x64
            artifact: pcint-translate-tool.exe
            artifact_path: build/bin/pcint-translate-tool.exe
            is_app_bundle: false
          - os: ubuntu-22.04          
            task: build:linux
            job_name: Linux-x64
            artifact: pcint-translate-tool
            artifact_path: build/bin/pcint-translate-tool
            is_app_bundle: false
            is_x86_linux: false
          - os: ubuntu-22.04          
            task: build:linux-x86 # Define your specific 32-bit compilation task here
            job_name: Linux-x86
            artifact: pcint-translate-tool-x86
            artifact_path: build/bin/pcint-translate-tool-x86
            is_app_bundle: false
            is_x86_linux: true
          - os: macos-latest
            task: build:darwin
            job_name: macOS-arm64
            artifact: pcint-translate-tool.app.zip
            artifact_path: build/bin/pcint-translate-tool.app.zip
            is_app_bundle: true

    steps:
      - name: Checkout Code from Codeberg
        run: |
          git clone --branch ${{ github.event.client_payload.ref }} ${{ github.event.client_payload.repository }}.git .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Go Tools (Wails & Task)
        id: cache-go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('go.mod') }}

      - name: Install Wails CLI
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Go Task
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Application
        shell: bash
        run: |
          task frontend:install
          task sidecar:install

          # On Windows: find the venv Scripts dir and prepend to PATH
          # so that python.exe / nltk etc. are resolvable by Task
          if [ "$RUNNER_OS" == "Windows" ]; then
            VENV_PYTHON=$(find .venv/Scripts -name "python.exe" 2>/dev/null | head -1)
            if [ -n "$VENV_PYTHON" ]; then
              VENV_DIR=$(dirname "$VENV_PYTHON")
              export PATH="$VENV_DIR:$PATH"
              echo "PATH=$VENV_DIR:$PATH" >> $GITHUB_ENV
              echo "Activated venv at $VENV_DIR"
            else
              echo "Warning: could not find .venv/Scripts/python.exe"
            fi
          fi

          task ${{ matrix.task }}

      - name: Zip macOS .app bundle
        if: matrix.is_app_bundle == true
        run: |
          cd build/bin
          zip -r --symlinks pcint-translate-tool.app.zip pcint-translate-tool.app

      - name: Verify artifact
        shell: bash
        run: |
          if [ ! -f "${{ matrix.artifact_path }}" ]; then
            echo "Error: artifact not found at ${{ matrix.artifact_path }}"
            ls -la build/bin/ || echo "(build/bin missing)"
            exit 1
          fi
          echo "Found: ${{ matrix.artifact_path }} ($(du -sh "${{ matrix.artifact_path }}" | cut -f1))"

      - name: Upload Artifact to Codeberg Release
        id: codeberg_release
        shell: bash
        run: |
          ARTIFACT_NAME="${{ matrix.artifact }}"
          FILE_PATH="${{ matrix.artifact_path }}"
          REPO_API="https://codeberg.org/api/v1/repos/bell/pcint-translate-tool"
          TOKEN="${{ secrets.CODEBERG_TOKEN }}"
          REF="${{ github.event.client_payload.ref }}"

          RELEASE_INFO=$(curl -s \
            -H "Authorization: token ${TOKEN}" \
            "${REPO_API}/releases/tags/${REF}")
          echo "Release API response: $RELEASE_INFO"

          RELEASE_ID=$(echo "$RELEASE_INFO" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" == "null" ]; then
            echo "Release not found for tag '${REF}'. Flagging for Actions Artifact fallback."
            echo "SKIP_UPLOAD=true" >> $GITHUB_ENV
            exit 0
          fi

          echo "Uploading $ARTIFACT_NAME → Release ID: $RELEASE_ID"
          HTTP_STATUS=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${TOKEN}" \
            -F "attachment=@${FILE_PATH}" \
            "${REPO_API}/releases/${RELEASE_ID}/assets?name=${ARTIFACT_NAME}")

          echo "HTTP $HTTP_STATUS"
          cat /tmp/upload_response.json

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Upload failed (HTTP $HTTP_STATUS). Will upload to GitHub Actions artifacts as a fallback."
            echo "SKIP_UPLOAD=true" >> $GITHUB_ENV
          else
            echo "Upload successful."
          fi

      - name: Upload to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14
