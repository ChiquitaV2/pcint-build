name: Codeberg Remote Build (Win/Lin/Mac)
on:
  repository_dispatch:
    types: [codeberg-build]
jobs:
  build:
    name: Build ${{ matrix.job_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: build:windows
            job_name: Windows-x64
            artifact: pcint-translate-tool.exe
            artifact_path: build/bin/pcint-translate-tool.exe
            is_app_bundle: false
          - os: ubuntu-latest
            task: build:linux
            job_name: Linux-x64
            artifact: pcint-translate-tool
            artifact_path: build/bin/pcint-translate-tool
            is_app_bundle: false
          - os: macos-latest
            task: build:darwin
            job_name: macOS-arm64
            artifact: pcint-translate-tool.app.zip
            artifact_path: build/bin/pcint-translate-tool.app.zip
            is_app_bundle: true

    steps:
      - name: Checkout Code from Codeberg
        run: |
          git clone --branch ${{ github.event.client_payload.ref }} ${{ github.event.client_payload.repository }}.git .

      # ── Go setup + cache ────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true                   # caches $GOPATH/pkg/mod automatically

      # ── Node setup + cache ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'                  # caches ~/.npm; change to 'pnpm'/'yarn' if needed
          cache-dependency-path: frontend/package-lock.json   # adjust path if needed

      # ── Python setup ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Tool installs (cached via Go module cache above) ────────────────────
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Go Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      # ── Linux system deps ───────────────────────────────────────────────────
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build Application using Taskfile
        run: |
          task setup
          task ${{ matrix.task }}

      # ── macOS: zip the .app bundle so it survives upload intact ─────────────
      - name: Zip macOS .app bundle
        if: matrix.is_app_bundle == true
        run: |
          APP_DIR="build/bin/pcint-translate-tool.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "Error: .app bundle not found at $APP_DIR"
            ls -la build/bin/
            exit 1
          fi
          cd build/bin
          zip -r --symlinks pcint-translate-tool.app.zip pcint-translate-tool.app
          echo "Created: build/bin/pcint-translate-tool.app.zip"

      # ── Verify artifact exists before upload ────────────────────────────────
      - name: Verify artifact
        shell: bash
        run: |
          FILE_PATH="${{ matrix.artifact_path }}"
          if [ ! -f "$FILE_PATH" ]; then
            echo "Error: artifact not found at $FILE_PATH"
            echo "Contents of build/bin/:"
            ls -la build/bin/ || echo "(directory missing)"
            exit 1
          fi
          echo "Found artifact: $FILE_PATH ($(du -sh "$FILE_PATH" | cut -f1))"

      # ── Upload to Codeberg release ───────────────────────────────────────────
      - name: Upload Artifact to Codeberg Release
        shell: bash
        run: |
          ARTIFACT_NAME="${{ matrix.artifact }}"
          FILE_PATH="${{ matrix.artifact_path }}"

          # Resolve the Release ID for the dispatched tag/ref
          RELEASE_INFO=$(curl -s \
            -H "Authorization: token ${{ github.event.client_payload.cb_token }}" \
            "${{ github.event.client_payload.repository }}/api/v1/releases/tags/${{ github.event.client_payload.ref }}")

          RELEASE_ID=$(echo "$RELEASE_INFO" | jq -r '.id')

          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "Release not found for tag '${{ github.event.client_payload.ref }}'. Skipping upload."
            exit 0
          fi

          echo "Uploading $ARTIFACT_NAME → Codeberg Release ID: $RELEASE_ID"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ github.event.client_payload.cb_token }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${FILE_PATH}" \
            "${{ github.event.client_payload.repository }}/api/v1/releases/${RELEASE_ID}/assets?name=${ARTIFACT_NAME}")

          echo "Upload HTTP status: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Upload failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Upload successful."
